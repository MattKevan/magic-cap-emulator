name: DataRover
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "1600"
settingGroups:
  mame-base:
    base:
      MAME_DIR: $(SRCROOT)/../../../mame
      CLANG_CXX_LANGUAGE_STANDARD: c++20
      CLANG_CXX_LIBRARY: libc++
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      SDKROOT: iphoneos
      ONLY_ACTIVE_ARCH: YES
      ENABLE_BITCODE: NO
      GCC_OPTIMIZATION_LEVEL: s
      SWIFT_VERSION: "5.0"
      HEADER_SEARCH_PATHS:
        - $(MAME_DIR)/src
        - $(MAME_DIR)/src/osd
        - $(MAME_DIR)/src/emu
        - $(MAME_DIR)/src/frontend/mame
        - $(MAME_DIR)/src/devices
        - $(MAME_DIR)/src/lib
        - $(MAME_DIR)/src/lib/util
        - $(MAME_DIR)/src/mame
        - $(MAME_DIR)/src/mame/shared
        - $(MAME_DIR)/src/lib/netlist
        - $(MAME_DIR)/src/osd/modules/file
        - $(MAME_DIR)/src/osd/modules/render
        - $(MAME_DIR)/3rdparty
        - $(MAME_DIR)/3rdparty/asio/include
        - $(MAME_DIR)/3rdparty/asmjit
        - $(MAME_DIR)/3rdparty/bgfx/include
        - $(MAME_DIR)/3rdparty/bgfx/3rdparty
        - $(MAME_DIR)/3rdparty/bgfx/3rdparty/khronos
        - $(MAME_DIR)/3rdparty/bimg/include
        - $(MAME_DIR)/3rdparty/bx/include
        - $(MAME_DIR)/3rdparty/bx/include/compat/osx
        - $(MAME_DIR)/3rdparty/expat/lib
        - $(MAME_DIR)/3rdparty/flac/include
        - $(MAME_DIR)/3rdparty/flac/src/libFLAC/include
        - $(MAME_DIR)/3rdparty/glm
        - $(MAME_DIR)/3rdparty/libjpeg
        - $(MAME_DIR)/3rdparty/linenoise
        - $(MAME_DIR)/3rdparty/lua/src
        - $(MAME_DIR)/3rdparty/portmidi/pm_common
        - $(MAME_DIR)/3rdparty/portmidi/porttime
        - $(MAME_DIR)/3rdparty/pugixml/src
        - $(MAME_DIR)/3rdparty/rapidjson/include
        - $(MAME_DIR)/3rdparty/softfloat3/source
        - $(MAME_DIR)/3rdparty/softfloat3/source/include
        - $(MAME_DIR)/3rdparty/softfloat3/source/8086
        - $(MAME_DIR)/3rdparty/softfloat3/bochs_ext
        - $(MAME_DIR)/3rdparty/softfloat3/build/MAME
        - $(MAME_DIR)/3rdparty/sol2
        - $(MAME_DIR)/3rdparty/sqlite3
        - $(MAME_DIR)/3rdparty/utf8proc
        - $(MAME_DIR)/3rdparty/zlib
        - $(MAME_DIR)/3rdparty/zstd/lib
        - $(SRCROOT)/Core/ios_compat
        - $(MAME_DIR)/build/generated
        - $(MAME_DIR)/build/generated/emu
        - $(MAME_DIR)/build/generated/emu/layout
        - $(MAME_DIR)/build/generated/mame
        - $(MAME_DIR)/build/generated/mame/layout
      GCC_PREPROCESSOR_DEFINITIONS:
        - NDEBUG
        - CRLF=2
        - LSB_FIRST
        - FLAC__NO_DLL
        - PUGIXML_HEADER_ONLY
        - ASMJIT_STATIC
        - SDLMAME_UNIX
        - SDLMAME_DARWIN
        - SDLMAME_NO_X11
        - USE_XINPUT=0
        - USE_XINPUT_WII_LIGHTGUN_HACK=0
        - USE_OPENGL=0
        - __STDC_LIMIT_MACROS
        - __STDC_FORMAT_MACROS
        - __STDC_CONSTANT_MACROS
        - BX_CONFIG_DEBUG=0
        - BGFX_CONFIG_MAX_FRAME_BUFFERS=128
        - NO_USE_PORTAUDIO
        - NO_USE_PULSEAUDIO
        - NO_USE_PIPEWIRE
        - USE_QTDEBUG=0
        - LUA_USE_POSIX
        - Z7_PPMD_SUPPORT
        - Z7_ST
        - ZSTD_DISABLE_ASM
        - YMFM_MAME
        - UTF8PROC_STATIC
        - USE_UTF8
        - XML_DEV_URANDOM
        - LITTLEENDIAN=1
        - BYTEORDER=1234
        - CPU_IS_LITTLE_ENDIAN=1
        - CPU_IS_BIG_ENDIAN=0
        - WORDS_BIGENDIAN=0
        - INLINE_LEVEL=5
        - DEBUGLEVEL=0
        - ENABLE_64_BIT_WORDS=1
        - FLAC__HAS_OGG=0
        - OGG_FOUND=0
        - FLAC__SYS_DARWIN
        - HAVE_LROUND=1
        - HAVE_INTTYPES_H
        - HAVE_STDBOOL_H
        - HAVE_STDINT_H
        - HAVE_STDIO_H
        - HAVE_STDLIB_H
        - HAVE_STRING_H
        - HAVE_SYS_STAT_H
        - HAVE_SYS_TYPES_H
        - HAVE_UNISTD_H
        - HAVE_FCNTL_H
        - HAVE_DLFCN_H
        - HAVE_ARC4RANDOM
        - HAVE_MEMMOVE
        - HAVE_MMAP
        - HAVE_CXX11
        - STDC_HEADERS
        - XML_CONTEXT_BYTES=1024
        - XML_DTD
        - XML_NS
        - XML_GE=1
        - PACKAGE=expat
        - VERSION=2.7.1
        - ASTCENC_SSE=0
        - ASTCENC_AVX=0
        - LUA_USE_POSIX
        - SOFTFLOAT_FAST_DIV64TO32
        - SOFTFLOAT_FAST_INT64
        - SOFTFLOAT_ROUND_ODD
    debug:
      base:
        GCC_OPTIMIZATION_LEVEL: "0"
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
    release:
      base:
        GCC_OPTIMIZATION_LEVEL: s
targets:
  DataRoverCore:
    type: library.static
    platform: iOS
    deploymentTarget: "16.0"
    settings:
      groups: [mame-base]
      base:
        PRODUCT_NAME: DataRoverCore
        SKIP_INSTALL: YES
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        ARCHS: $(ARCHS_STANDARD)
        VALID_ARCHS: arm64
        GCC_C_LANGUAGE_STANDARD: gnu17
        CLANG_ENABLE_MODULES: NO
        CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: NO
        GCC_WARN_UNUSED_FUNCTION: NO
        GCC_WARN_64_TO_32_BIT_CONVERSION: NO
        CLANG_CXX_LIBRARY: libc++
    sources:
      - path: Core/datarover_osd.cpp
      - path: Core/file-list.txt
        buildPhase: none
      - path: Core/gen_sources.py
        buildPhase: none
    # MAME sources are injected by scripts/inject_mame_sources.py (xcodegen
    # has no file-list include; generated project.yml fragment is merged here).
    # Run `python3 scripts/inject_mame_sources.py` after `xcodegen generate`.
  DataRover:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DataRover
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: App/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: App/CoreBridge.h
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        OTHER_LDFLAGS:
          - -lc++
          - -framework
          - CoreMIDI
    sources:
      - path: App/DataRoverApp.swift
      - path: App/CoreBridge.swift
      - path: App/EmulatorView.swift
      - path: App/TouchPenView.swift
      - path: App/ToolbarView.swift
      - path: App/CoreBridge.h
        buildPhase: none
    dependencies:
      - target: DataRoverCore
schemes:
  DataRoverCore:
    build:
      targets:
        DataRoverCore: all
    run:
      config: Release
  DataRover:
    build:
      targets:
        DataRover: all
        DataRoverCore: all
    run:
      config: Debug
