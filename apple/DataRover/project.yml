name: DataRover
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "1600"
packages:
  DataRoverKit:
    path: ../DataRoverKit
# MAME's include layout is identical on both platforms, so it lives here and
# both core targets inherit it through their platform group's $(inherited).
# Core/ios_compat is deliberately absent: it holds stand-ins for the Carbon
# and CoreAudio headers iOS lacks, and its Carbon/Carbon.h would shadow the
# real framework header for the macOS core (osdlib_macosx.cpp includes it).
settings:
  base:
    # Apple silicon only. Both Apple apps and both cores are arm64-only: the
    # host machine, the iOS simulator it runs, and the iOS devices are all
    # arm64, and the Intel slice only ever doubled the compile for an
    # architecture nothing here can run. Release keeps this value too (there
    # is no $(ARCHS_STANDARD) left to widen it), so a distributable build is
    # arm64-only as well.
    ARCHS: arm64
    HEADER_SEARCH_PATHS:
      - $(MAME_DIR)/src
      - $(MAME_DIR)/src/osd
      - $(MAME_DIR)/src/emu
      - $(MAME_DIR)/src/frontend/mame
      - $(MAME_DIR)/src/devices
      - $(MAME_DIR)/src/lib
      - $(MAME_DIR)/src/lib/util
      - $(MAME_DIR)/src/mame
      - $(MAME_DIR)/src/mame/shared
      - $(MAME_DIR)/src/lib/netlist
      - $(MAME_DIR)/src/osd/modules/file
      - $(MAME_DIR)/src/osd/modules/render
      - $(MAME_DIR)/3rdparty
      - $(MAME_DIR)/3rdparty/asio/include
      - $(MAME_DIR)/3rdparty/asmjit
      - $(MAME_DIR)/3rdparty/bgfx/include
      - $(MAME_DIR)/3rdparty/bgfx/3rdparty
      - $(MAME_DIR)/3rdparty/bgfx/3rdparty/khronos
      - $(MAME_DIR)/3rdparty/bimg/include
      - $(MAME_DIR)/3rdparty/bx/include
      - $(MAME_DIR)/3rdparty/bx/include/compat/osx
      - $(MAME_DIR)/3rdparty/expat/lib
      - $(MAME_DIR)/3rdparty/flac/include
      - $(MAME_DIR)/3rdparty/flac/src/libFLAC/include
      - $(MAME_DIR)/3rdparty/glm
      - $(MAME_DIR)/3rdparty/libjpeg
      - $(MAME_DIR)/3rdparty/linenoise
      - $(MAME_DIR)/3rdparty/lua/src
      - $(MAME_DIR)/3rdparty/portmidi/pm_common
      - $(MAME_DIR)/3rdparty/portmidi/porttime
      - $(MAME_DIR)/3rdparty/pugixml/src
      - $(MAME_DIR)/3rdparty/rapidjson/include
      - $(MAME_DIR)/3rdparty/softfloat3/source
      - $(MAME_DIR)/3rdparty/softfloat3/source/include
      - $(MAME_DIR)/3rdparty/softfloat3/source/8086
      - $(MAME_DIR)/3rdparty/softfloat3/bochs_ext
      - $(MAME_DIR)/3rdparty/softfloat3/build/MAME
      - $(MAME_DIR)/3rdparty/sol2
      - $(MAME_DIR)/3rdparty/sqlite3
      - $(MAME_DIR)/3rdparty/utf8proc
      - $(MAME_DIR)/3rdparty/zlib
      - $(MAME_DIR)/3rdparty/zstd/lib
      - $(MAME_DIR)/build/generated
      - $(MAME_DIR)/build/generated/emu
      - $(MAME_DIR)/build/generated/emu/layout
      - $(MAME_DIR)/build/generated/mame
      - $(MAME_DIR)/build/generated/mame/layout
settingGroups:
  mame-base:
    base:
      MAME_DIR: $(SRCROOT)/../../../mame
      # Compile the cores through ccache (tools/ccache/{clang,clang++}). The
      # wrappers fall back to the real compiler when ccache is not installed,
      # so the build does not depend on it. 1159 translation units per
      # platform are otherwise recompiled from scratch whenever the object
      # cache is lost; the cache lives in ~/Library/Caches/ccache and is
      # inspected with `ccache -s`.
      CC: $(SRCROOT)/../../tools/ccache/clang
      CXX: $(SRCROOT)/../../tools/ccache/clang++
      CLANG_CXX_LANGUAGE_STANDARD: c++20
      CLANG_CXX_LIBRARY: libc++
      IPHONEOS_DEPLOYMENT_TARGET: "26.0"
      ONLY_ACTIVE_ARCH: NO
      GCC_OPTIMIZATION_LEVEL: s
      SWIFT_VERSION: "5.0"
      GCC_PREPROCESSOR_DEFINITIONS:
        - NDEBUG
        - CRLF=2
        - LSB_FIRST
        - FLAC__NO_DLL
        - PUGIXML_HEADER_ONLY
        - ASMJIT_STATIC
        - FORCE_DRC_C_BACKEND=1
        - DATAROVER_IOS_NO_JIT_FLUSH=1
        - SDLMAME_DARWIN
        - OSD_NET_USE_SLIRP
        - USE_XINPUT=0
        - USE_XINPUT_WII_LIGHTGUN_HACK=0
        - USE_OPENGL=0
        - __STDC_LIMIT_MACROS
        - __STDC_FORMAT_MACROS
        - __STDC_CONSTANT_MACROS
        - BX_CONFIG_DEBUG=0
        - BGFX_CONFIG_MAX_FRAME_BUFFERS=128
        - NO_USE_PORTAUDIO
        - NO_USE_PULSEAUDIO
        - NO_USE_PIPEWIRE
        - USE_QTDEBUG=0
        - LUA_USE_POSIX
        - Z7_PPMD_SUPPORT
        - Z7_ST
        - ZSTD_DISABLE_ASM
        - YMFM_MAME
        - UTF8PROC_STATIC
        - USE_UTF8
        - XML_DEV_URANDOM
        - LITTLEENDIAN=1
        - BYTEORDER=1234
        - CPU_IS_LITTLE_ENDIAN=1
        - CPU_IS_BIG_ENDIAN=0
        - WORDS_BIGENDIAN=0
        - INLINE_LEVEL=5
        - DEBUGLEVEL=0
        - ENABLE_64_BIT_WORDS=1
        - FLAC__HAS_OGG=0
        - OGG_FOUND=0
        - FLAC__SYS_DARWIN
        - HAVE_LROUND=1
        - HAVE_INTTYPES_H
        - HAVE_STDBOOL_H
        - HAVE_STDINT_H
        - HAVE_STDIO_H
        - HAVE_STDLIB_H
        - HAVE_STRING_H
        - HAVE_SYS_STAT_H
        - HAVE_SYS_TYPES_H
        - HAVE_UNISTD_H
        - HAVE_FCNTL_H
        - HAVE_DLFCN_H
        - HAVE_ARC4RANDOM
        - HAVE_MEMMOVE
        - HAVE_MMAP
        - HAVE_CXX11
        - STDC_HEADERS
        - XML_CONTEXT_BYTES=1024
        - XML_DTD
        - XML_NS
        - XML_GE=1
        - PACKAGE=expat
        - VERSION=2.7.1
        - ASTCENC_SSE=0
        - ASTCENC_AVX=0
        - LUA_USE_POSIX
        - SOFTFLOAT_FAST_DIV64TO32
        - SOFTFLOAT_FAST_INT64
        - SOFTFLOAT_ROUND_ODD
    # Note for anyone adding a per-configuration setting here: a settingGroup's
    # `debug:`/`release:` blocks CANNOT override a key its own `base` block
    # already sets — xcodegen applies `base` last, so such an entry is silently
    # inert (verified with a scratch project: with both blocks setting
    # ONLY_ACTIVE_ARCH, the resolved value was the base one). Use `configs:`,
    # as the DataRoverMac target does for ENABLE_DEBUG_DYLIB.
    #
    # Debug intentionally keeps the base's -Os: the emulation loop needs the
    # optimisation to hold real time under MAME throttling. There is no
    # architecture left for ONLY_ACTIVE_ARCH to narrow here — the project is
    # arm64-only (see the ARCHS note at the top of this file's settings).
  # Per-platform deltas over mame-base. Keep both groups to settings only that
  # genuinely differ, so the core stays one behaviour surface.
  mame-ios:
    base:
      HEADER_SEARCH_PATHS:
        - $(inherited)
        - $(SRCROOT)/Core/ios_compat
        - $(SRCROOT)/../../build/apple-network-deps/$(PLATFORM_NAME)/include
      LIBRARY_SEARCH_PATHS:
        - $(inherited)
        - $(SRCROOT)/../../build/apple-network-deps/$(PLATFORM_NAME)/lib
  mame-mac:
    base:
      HEADER_SEARCH_PATHS:
        - $(inherited)
        - $(SRCROOT)/../../build/apple-network-deps/$(PLATFORM_NAME)/include
      LIBRARY_SEARCH_PATHS:
        - $(inherited)
        - $(SRCROOT)/../../build/apple-network-deps/$(PLATFORM_NAME)/lib
      OTHER_LDFLAGS:
        - -lc++
        - -lslirp
        - -lglib-2.0
        - -lpcre2-8
        - -lresolv
        - -liconv
        - -lm
        - -framework Foundation
        - -framework Carbon
        - -framework CoreAudio
        - -framework CoreFoundation
        - -framework CoreMIDI
targets:
  DataRoverCore:
    type: library.static
    platform: iOS
    deploymentTarget: "26.0"
    settings:
      groups: [mame-base, mame-ios]
      base:
        PRODUCT_NAME: DataRoverCore
        SKIP_INSTALL: YES
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        # The iOS guest CPU uses MAME's interpreter because App Store apps
        # cannot rely on writable executable memory. Optimize that hot path
        # for throughput rather than code size.
        GCC_OPTIMIZATION_LEVEL: 3
        GCC_C_LANGUAGE_STANDARD: gnu17
        CLANG_ENABLE_MODULES: NO
        CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: NO
        GCC_WARN_UNUSED_FUNCTION: NO
        GCC_WARN_64_TO_32_BIT_CONVERSION: NO
        CLANG_CXX_LIBRARY: libc++
    sources:
      - path: Core/datarover_osd.cpp
      - path: Core/file-list.txt
        buildPhase: none
      - path: Core/gen_sources.py
        buildPhase: none
    # MAME sources are injected by scripts/inject_mame_sources.py (xcodegen
    # has no file-list include; generated project.yml fragment is merged here).
    # Run `python3 scripts/inject_mame_sources.py` after `xcodegen generate`.
  DataRoverCoreMac:
    type: library.static
    platform: macOS
    deploymentTarget: "26.0"
    settings:
      groups: [mame-base, mame-mac]
      base:
        PRODUCT_NAME: DataRoverCoreMac
        SKIP_INSTALL: YES
        SUPPORTED_PLATFORMS: macosx
        GCC_C_LANGUAGE_STANDARD: gnu17
        CLANG_ENABLE_MODULES: NO
        CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: NO
        GCC_WARN_UNUSED_FUNCTION: NO
        GCC_WARN_64_TO_32_BIT_CONVERSION: NO
        CLANG_CXX_LIBRARY: libc++
        MACOSX_DEPLOYMENT_TARGET: "26.0"
    sources:
      - path: Core/datarover_osd.cpp
      - path: Core/file-list.txt
        buildPhase: none
      - path: Core/gen_sources.py
        buildPhase: none
    # Same injection contract as DataRoverCore: inject_mame_sources.py fills
    # this target's Sources phase, minus Core/datarover_carboncore_stubs.cpp
    # (its Pasteboard/kUTType definitions collide with the real Carbon
    # symbols this platform links against) and without the ios_compat header
    # path that would shadow the framework's Carbon/Carbon.h. The per-file
    # COMPILER_FLAGS are identical to the iOS core's.
  DataRoverMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    # The product is DataRover.app while the target is DataRoverMac; without
    # this the project's product reference (and the scheme's BuildableName)
    # would name a DataRoverMac.app that never gets built.
    productName: DataRover
    settings:
      base:
        PRODUCT_NAME: DataRover
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DataRover.mac
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Mac/DataRover.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # Xcode 27's ad-hoc "Sign to Run Locally" step omits `--options runtime`
        # even with ENABLE_HARDENED_RUNTIME=YES, so the signature would carry
        # flags=0x2 (adhoc) and no runtime bit. Pass it explicitly.
        OTHER_CODE_SIGN_FLAGS: --options runtime
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../../build/apple-network-deps/$(PLATFORM_NAME)/lib
        OTHER_LDFLAGS:
          - -lc++
          - -lslirp
          - -lglib-2.0
          - -lpcre2-8
          - -lresolv
          - -liconv
          - -lm
          - -framework
          - Foundation
          - -framework
          - Carbon
          - -framework
          - CoreAudio
          - -framework
          - CoreFoundation
          - -framework
          - CoreMIDI
        SWIFT_VERSION: "5.0"
      configs:
        Debug:
          # Hardened runtime enables library validation, and Xcode's Debug
          # layout loads the app's code from an ad-hoc-signed
          # DataRover.debug.dylib inside the bundle. Ad-hoc signatures carry no
          # team ID, so dyld rejects the pair ("mapping process and mapped file
          # (non-platform) have different Team IDs") and the app never starts.
          # Debug therefore links one binary, which the same ad-hoc signature
          # covers end to end.
          ENABLE_DEBUG_DYLIB: NO
    sources:
      - path: Mac
      - path: App/AppIcon.icon
    dependencies:
      - target: DataRoverCoreMac
      - package: DataRoverKit
        product: DataRoverShell
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: DataRover
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
        LSMinimumSystemVersion: "26.0"
  DataRover:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DataRover
        # Icon Composer document (App/AppIcon.icon); the name must match the
        # file, less extension. actool compiles it into the Liquid Glass icon
        # set plus legacy raster fallbacks for iOS < 26.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: App/Info.plist
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../../build/apple-network-deps/$(PLATFORM_NAME)/lib
        # xcodegen appends -ObjC to OTHER_LDFLAGS for a target that links a
        # static-library target (here DataRoverCore) and re-adds it on every
        # `xcodegen generate`, so scripts/inject_mame_sources.py strips it
        # again. The DataRoverCore archive implements no Objective-C classes
        # (its only .mm files, bgfx glcontext_eagl/renderer_mtl, are ObjC++
        # without @implementation), so the flag is inert either way; it is
        # kept out because commit 3594f42 removed it deliberately and the
        # committed file must stay the pipeline output.
        OTHER_LDFLAGS:
          - -lc++
          - -lslirp
          - -lglib-2.0
          - -lpcre2-8
          - -lresolv
          - -liconv
          - -lm
          - -framework
          - Foundation
          - -framework
          - CoreFoundation
          - "-framework CoreMIDI"
    sources:
      - path: App/AppIcon.icon
      - path: App/DataRoverApp.swift
      - path: App/EmulatorView.swift
      - path: App/TouchPenView.swift
      - path: App/HostHooks.swift
    dependencies:
      - target: DataRoverCore
      - package: DataRoverKit
        product: DataRoverShell
  DataRoverUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DataRover.uitests
        TEST_TARGET_NAME: DataRover
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: UITests
    dependencies:
      - target: DataRover
schemes:
  DataRoverCore:
    build:
      targets:
        DataRoverCore: all
    run:
      config: Release
  DataRover:
    build:
      targets:
        DataRover: all
        DataRoverCore: all
    run:
      config: Debug
    test:
      targets: [DataRoverUITests]
  DataRoverMac:
    build:
      targets:
        DataRoverMac: all
        DataRoverCoreMac: all
    run:
      config: Debug
      # xcodegen sorts the build targets, so without this the Run action would
      # adopt the first one (the core library) instead of the app.
      executable: DataRoverMac
